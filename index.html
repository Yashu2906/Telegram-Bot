<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="color-scheme" content="light">

  <title>Ad Link Generator</title>

  <link rel="stylesheet" href="style.css">

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!--
    MONETAG SDK

    IMPORTANT:
    This must be the exact SDK tag generated by
    your Monetag dashboard.

    Current zone:
    11551467

    SDK function:
    show_11551467
  -->
  <script
    src="https://libtl.com/sdk.js"
    data-zone="11551467"
    data-sdk="show_11551467"
  ></script>
</head>

<body>

  <main class="app-shell">

    <!-- =====================================================
         GENERATOR VIEW
    ====================================================== -->

    <section
      id="generatorView"
      class="panel"
      hidden
    >

      <div class="brand">

        <div
          class="logo"
          aria-hidden="true"
        >
          AD
        </div>

        <div>
          <h1>Ad Link Generator</h1>

          <p>
            Create your Telegram ad link
          </p>
        </div>

      </div>


      <!-- URL GENERATOR -->

      <form
        id="generatorForm"
        class="stack"
      >

        <label class="field">

          <span>
            Original URL
          </span>

          <input
            id="urlInput"
            type="url"
            inputmode="url"
            placeholder="https://example.com"
            autocomplete="url"
            required
          >

        </label>


        <button
          id="generateButton"
          class="primary-button"
          type="submit"
        >
          Generate Link
        </button>

      </form>


      <!-- GENERATED LINK -->

      <div class="stack">

        <label class="field">

          <span>
            Generated Telegram Link
          </span>

          <textarea
            id="generatedLink"
            rows="4"
            readonly
            placeholder="Your generated Telegram link will appear here"
          ></textarea>

        </label>


        <button
          id="copyButton"
          class="secondary-button"
          type="button"
          disabled
        >
          Copy
        </button>

      </div>


      <p
        id="generatorMessage"
        class="message"
        role="status"
        aria-live="polite"
      ></p>

    </section>


    <!-- =====================================================
         VISITOR VIEW
    ====================================================== -->

    <section
      id="visitorView"
      class="panel compact"
      hidden
    >

      <div class="brand centered">

        <div
          class="logo"
          aria-hidden="true"
        >
          GO
        </div>

        <div>

          <h1 id="visitorTitle">
            Ready to continue
          </h1>

          <p id="visitorSubtitle">
            Watch the ad below to continue.
          </p>

        </div>

      </div>


      <!--
        Rewarded Interstitial requires a user action.
      -->

      <button
        id="retryAdButton"
        class="primary-button"
        type="button"
      >
        Continue & Watch Ad
      </button>


      <p
        id="visitorMessage"
        class="message"
        role="status"
        aria-live="polite"
      ></p>


      <div
        class="ad-note"
        aria-hidden="true"
      ></div>

    </section>


    <!-- =====================================================
         INVALID LINK VIEW
    ====================================================== -->

    <section
      id="invalidView"
      class="panel compact"
      hidden
    >

      <div class="brand centered">

        <div
          class="logo warning"
          aria-hidden="true"
        >
          !
        </div>

        <div>

          <h1>
            Invalid Link
          </h1>

          <p>
            This link is invalid or corrupted.
          </p>

        </div>

      </div>


      <p
        id="invalidMessage"
        class="message error"
      >
        Please ask the sender to create a new link.
      </p>

    </section>

  </main>


  <!-- Your application JavaScript -->
  <script src="app.js"></script>

</body>
</html>
